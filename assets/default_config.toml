# files - settings guide
#
# Default template with placeholder values. Replace the example paths with
# your own, set `enabled = true` on the shares you want, then run:
#
#     files --check-config
#
# Use literal strings ('...') for paths. Basic strings ("...") process
# backslash escapes, so "X:\Example" is a parse error.

version = 2


# ---------------------------------------------------------------------------
# Mappings - the shares to search. Add as many as needed; every enabled one
# is indexed, searched, and merged into one ranked list.
#
# Rules enforced by the checker:
#   * no two mappings may point at the same directory;
#   * a tree mapping may not sit inside another enabled mapping
#     (a tree inside a live mapping is allowed).
#
# kind    = "flat" | "tree" | "live"
# refresh = "auto" | "manual"   (flat defaults to auto, tree to manual;
#                                not allowed on live)
# ---------------------------------------------------------------------------

# Flat: a single directory kept in memory, with a cheap freshness check.
[[mapping]]
name    = "example-flat"
path    = 'X:\example\flat'
kind    = "flat"
enabled = false
refresh = "auto"

# Tree: a full directory tree, kept current by change notifications.
# F5 refreshes on demand.
[[mapping]]
name    = "example-tree"
path    = 'Y:\example\projects'
kind    = "tree"
enabled = false
refresh = "manual"

# Live: nothing indexed in the background; each search queries the server.
# Results cover only the folders that were searched.
# depth = 1 to 4 (default 1). Deeper searches cost more round trips.
[[mapping]]
name    = "example-live"
path    = '\\example-server\archive'
kind    = "live"
depth   = 1
enabled = false


# ---------------------------------------------------------------------------
# Global options. Command line > environment > this file.
# Commented lines show the default value.
# ---------------------------------------------------------------------------
[settings]
# Shares walked at the same time.
# max_concurrent_scans = 2

# Show a status-line notice when a share needs refreshing.
# stale_notices = true

# Panel behaviour.
# hide_on_blur       = true    # hide when another window is clicked
# hide_after_opening = true    # hide once a file opens (copies keep it open)
# hide_on_escape     = true    # false = Escape clears the search box instead

# Open assembled PDFs read-only (protects the local cache).
# pdf_read_only = true

# Local cache for the index, assembled documents and staged updates.
# Defaults to the local application data folder.
# cache_dir = 'D:\example-cache'

# Diagnostic log of index re-reads. Leave off unless troubleshooting;
# the file is never rotated.
# index_log = 'C:\example\files-index.log'

# Advanced.
# enum_strategy = "handle-dirinfo"   # handle-dirinfo | findfirstex | std
# matcher       = "simd"             # simd | naive
# server_filter = false              # enable only after `files --bench` passes
# persist       = true               # keep the on-disk index between runs
# live_updates  = true               # re-read changed folders as they change
# history       = true               # remember codes between sessions

# Global hotkey: ctrl/alt/shift/win + a letter, digit, f1-f24 or space.
# "off" disables it. The Copilot key is "shift+win+f23".
# hotkey        = "ctrl+shift+space"

# Appearance.
# backdrop      = "acrylic"          # acrylic | mica | tabbed | none
# result_layout = "compact"          # compact | detailed
# dock          = "free"             # free | top | bottom
# columns       = 1                  # 1 | 2 | 3
# theme         = "light"            # light | dark | system

# Check GitHub for updates every four hours (only when update_from is unset).
# check_for_updates = true

# Default viewer for Enter. F2 switches it and saves the choice here.
#   auto  - open with the program Windows has registered for the file type
#   pdf   - assemble a drawing set into one PDF (.dwg still opens in avwin)
#   avwin - always open the selected file in avwin
viewer = "auto"                      # auto | pdf | avwin

# Program used for assembled PDFs. Unset = the system PDF viewer.
# pdf_viewer = 'C:\Program Files\Example\PDFViewer.exe'

# Extensions never shown in results (no dot or wildcard needed).
# Set to [] to hide nothing. Takes effect on next start.
hide_extensions = ['db', 'js', 'lnk', 'ini', 'tmp', 'bak', 'url', 'exe', 'dll', 'bat', 'cmd', 'ps1', 'vbs']

# Also hide files Windows marks hidden or system. Requires F5 re-scan.
hide_system_files = true

# Show technical detail in error messages.
# dev_mode = false

# Shared folder containing latest.toml and the installer it names.
# Unset = no update checks from a share.
# update_from = '\\example-server\software\files'


# ---------------------------------------------------------------------------
# Aliases - short names for codes you search often.
#
#   * name: ASCII, no spaces, unique; the whole search line must match it.
#   * code: any valid search line, at least 3 characters.
#   * note: optional, for your reference only.
# ---------------------------------------------------------------------------
# [[alias]]
# name = "ex"
# code = "00-X-0000"
# note = "Example alias"
#
# [[alias]]
# name = "pdfs"
# code = "ext:pdf example"