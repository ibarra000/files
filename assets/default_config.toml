# files - the shares to search
#
# Written automatically on first run. Edit freely, then check it with
#
#     files --check-config
#
# which validates everything below without touching the network.
#
# Use literal strings ('...') for paths. TOML *basic* strings ("...") process
# backslash escapes, so "R:\Documents" is a parse error.

version = 2


# ---------------------------------------------------------------------------
# CustomPro. One large directory holding every job's files directly, so a
# listing of it is the whole share.
#
# kind = "flat" reads that single directory and keeps it in memory. It also
# gets the cheap freshness check: the directory's timestamp is probed about
# once a minute - three round trips - and a full re-read only happens when it
# has actually moved.
# ---------------------------------------------------------------------------
[[mapping]]
name    = "custompro"
path    = 'V:\Documents\custpro'
kind    = "flat"
enabled = true
refresh = "auto"          # see the note under `jobs`


# ---------------------------------------------------------------------------
# The job share. Walked whole, every folder, and kept in memory.
#
# This used to be a set of regular expressions that turned a code into the one
# folder it was expected to live in. That worked for codes whose folders
# followed the naming rule and failed silently for every other: the file was
# not reported as missing, it was invisible, because nothing ever looked in
# the folder it was actually in.
#
# kind = "tree" removes the guess. Every folder under the path is read, so a
# code is *searched for* rather than deduced, and a file in a folder no rule
# would have predicted is found like any other. A match on a folder name
# brings that folder's files with it, which is how a job code usually behaves.
#
# The cost is a background walk - one to three minutes for a share of a few
# hundred thousand folders - which streams results as it goes, so the share is
# searchable about a second in rather than when it finishes. The result is
# cached, so only the first run after an upgrade pays for it in full.
#
# After that the share is kept current by the server reporting changes as they
# happen: only the folders that actually changed are re-read, which is a
# handful of round trips against the nine hundred thousand a full pass costs.
# A new job folder appears within seconds, and the result is written back to
# the cache, so the index keeps its place between sessions.
#
#
# refresh = "auto" | "manual"
#
# Whether a *timer* may re-read the whole share. Live updates apply either way,
# and F5 works either way; what this decides is whether the share re-reads
# itself when nobody asked.
#
# A tree defaults to "manual" and a flat share to "auto", and the asymmetry is
# the point. A flat share is one directory behind a three-round-trip freshness
# probe. A tree is three hundred thousand directories with no such probe, so a
# timed pass is nine hundred thousand round trips - and with a few hundred
# people running this, all of them starting that pass on the same schedule is
# not a background hum, it is an outage. The half-hourly re-walk this used to
# do was exactly that.
#
# What you give up: a share whose change notifications silently stop will go
# stale without a timer to catch it. The status line says which share and why,
# and F5 offers to update it - so the failure is visible rather than silent,
# which is the trade being made. `files --doctor` says whether notifications
# are working at all.
# ---------------------------------------------------------------------------
[[mapping]]
name    = "jobs"
path    = 'R:\'
kind    = "tree"
enabled = true
refresh = "manual"


# ---------------------------------------------------------------------------
# More shares. Add as many as you have; there is no limit, and every enabled
# one is indexed, searched, and merged into a single ranked list.
#
# That was not true before: the index had one flat slot and one tree slot, so a
# second flat mapping was refused outright and a second tree mapping was
# accepted, listed by `--doctor`, and then silently never walked. If you have
# been carrying extra mappings that never seemed to do anything, this is why.
#
# Two rules the checker enforces, both for the same reason - indexing one
# directory twice returns every file twice:
#
#   * no two mappings may point at the same directory;
#   * a tree mapping may not sit inside another enabled mapping.
#
# Check any change with `files --check-config`, which validates everything
# here without touching the network.
# ---------------------------------------------------------------------------
# [[mapping]]
# name    = "archive"
# path    = 'S:\archive'
# kind    = "tree"
# enabled = true


# ---------------------------------------------------------------------------
# A share too large to index at all.
#
# kind = "live" is the honest answer to a share where a walk costs minutes and
# a few hundred megabytes. Nothing is read in the background: every settled
# search becomes one wildcard query against the share, which the file server
# evaluates itself and answers with the matches alone - a few kilobytes,
# whether the folder holds a thousand files or ten million.
#
# What you give up is completeness, and it is not a small thing. The server
# matches within one folder at a time, so a live share can only answer for the
# folders one query had time to reach. The panel says which ones those were:
# an empty result on a live share never reads as "there is no such file", it
# reads as "nothing in the folders that were searched". Believing the first
# when the second is true is the mistake this program is built to prevent.
#
# depth is how far below the path a search reaches. One - the default - is the
# share's own folder, plus any folder whose *name* matches what you typed,
# which is how a job code usually behaves and costs a single round trip.
# Deeper means listing every folder on the way down, because a filtered query
# cannot reveal a folder whose name does not match: depth 2 against a root
# holding two hundred folders is two hundred round trips for one search. The
# maximum is 4.
#
# There is no `refresh` key here and nothing is cached. A live share is read
# when you search it and at no other time, so `refresh` is refused rather than
# accepted and ignored.
#
# A walked tree may sit *inside* a live share, and that is the useful
# arrangement: index the folder people work in, and ask the server about the
# rest. The live pass skips any folder another mapping already covers, so
# nothing is returned twice.
# ---------------------------------------------------------------------------
# [[mapping]]
# name    = "old-jobs"
# path    = '\fileserver\archive'
# kind    = "live"
# depth   = 1
# enabled = true


# ---------------------------------------------------------------------------
# Global options. The command line overrides the environment, which overrides
# what is set here.
# ---------------------------------------------------------------------------
[settings]
# How many shares are walked at once. Each walk already keeps eight directory
# reads in flight, so 2 is sixteen outstanding requests against a file server
# that belongs to somebody else. Raising it shortens a cold start over several
# shares and lengthens everyone else's afternoon; a share waiting its turn says
# so on the status line rather than looking idle.
# max_concurrent_scans = 2

# Whether the status line says a share needs refreshing, and which one.
#
# On by default: a list that has stopped tracking the drive is exactly the
# thing this program refuses to hide. Turn it off for somebody who was handed
# the tool, does not need current data, and should not be nagged - the ages are
# still there on F5, which they only see by asking.
# stale_notices = true

# enum_strategy = "handle-dirinfo"   # handle-dirinfo | findfirstex | std
# matcher       = "simd"             # simd | naive
# server_filter = false              # turn on only after `files --bench` passes
# persist       = true               # keep the on-disk index between runs
# live_updates  = true               # re-read changed folders as they change
# history       = true               # remember codes between sessions

# The global hotkey that summons this window from wherever you are working,
# into a compact quick-search view: type, press Enter to open, or Escape to
# put it back. The window returns to the size and place it had, and the
# program you were in gets the keyboard back.
#
# ctrl, alt, shift and win, plus a letter, a digit, f1-f24 or space. Use "off"
# to claim no key at all. If another program already owns the combination this
# one says so at startup and carries on without it - `files --doctor` reports
# which window it would move, which is the thing worth checking if the key
# seems to do nothing.
#
# The Copilot key on newer keyboards sends shift+win+f23, so that value binds
# the key itself.
# hotkey        = "ctrl+shift+space"

# How the panel is coloured.
#
# "light" is a warm, bright panel and is what you get if this is not set.
# "dark" is the same scheme on a low ground, for a dark room. "system" follows
# the Windows setting, which is what this program used to do unconditionally -
# and which meant a machine in dark mode got a near-black panel whether or not
# that was wanted.
# theme         = "light"            # light | dark | system

# Which viewer Enter uses. Left uncommented because F2 switches it while
# running and saves the choice here, and the writer replaces this line rather
# than appending a second one.
viewer = "auto"                      # auto | pdf | avwin
#
# auto  picks per file: a .pdf is assembled into the whole document, and
#       anything else - a drawing included - is handed to avwin, which opens
#       far more kinds of file than this program knows about. It is the
#       default for a fresh install.
# pdf   assembles a document out of anything it can. A drawing is the one
#       thing it cannot: DWG is AutoCAD's own closed format and there is no
#       way to read it here, so a .dwg still opens in avwin.
# avwin always hands the one selected file to avwin, whatever it is - which is
#       how to see a .pdf there rather than in the PDF viewer.

# Files that are never offered, however well they match.
#
# A drawing share is not only drawings: alongside them sit the files Windows
# and its programs leave behind, and a search for a job code used to return
# Thumbs.db and a handful of shortcuts as readily as it returned the drawing.
#
# Write extensions, not patterns and not filenames - 'db', not '*.db' and not
# 'Thumbs.db'. The leading dot is optional and the case does not matter. A
# single one may be written on its own: hide_extensions = 'db'.
#
# Left uncommented because this is what a fresh install is expected to want.
# Set it to [] to hide nothing, which is the quickest way to find out whether
# this is why a file you expected is not in the list. The change takes effect
# at the next start; it needs no re-scan of the drives, because the filter is
# applied as the results are chosen rather than as the index is built.
hide_extensions = ['db', 'js', 'lnk', 'ini', 'tmp', 'bak', 'url', 'exe', 'dll', 'bat', 'cmd', 'ps1', 'vbs']

# Also hide whatever Windows itself marks hidden or system.
#
# That is the ~$ files Office leaves behind while a document is open, and the
# bookkeeping a file server keeps in the folder it belongs to.
#
# Unlike the list above, this one *does* need a re-scan to take effect: the
# attribute is not part of the name, so it is read while the folder is being
# listed and is not stored anywhere afterwards. Press F5 and choose the drive.
# Folders are never hidden by this, whatever they are marked - some servers
# mark a whole share system, and honouring that would hide the share.
hide_system_files = true
