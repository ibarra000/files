[package]
name = "files"
version = "0.2.0"
edition = "2024"
# eframe and egui_kittest 0.36 need 1.95. CI checks this version.
rust-version = "1.95"
# Read by the installer, Apps & Features, and the version block `build.rs` embeds.
description = "files - nfs & smb indexer"
# Release source for the update check unless `update_from` names a share.
# Read at compile time by `update::github::Repo::ours`.
repository = "https://github.com/ibarra000/files"
authors = ["files"]

[lib]
name = "files"
path = "src/lib.rs"

[[bin]]
name = "files"
path = "src/main.rs"

# Console front end. A separate binary because the PE subsystem bit, which
# decides whether a shell waits for output, is set per executable.
[[bin]]
name = "files-cli"
path = "src/bin/files-cli.rs"

[dependencies]
# Desktop shell. `glow`, not `wgpu`: window transparency on Windows comes from
# the redirection bitmap, which only OpenGL presentation draws into.
# `default_fonts` is off (see the `test-fonts` feature); `accesskit` exposes the
# panel to Narrator and magnifiers.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "glow",
] }

# Reads the panel's `HWND` from the toolkit in `gui::hwnd_of`.
raw-window-handle = "0.6"

# Logging facade shared with `eframe`, `winit` and `glutin`; sink in `src/log.rs`.
log = "0.4"
# Byte search for the matcher.
memchr = "2.8"
rayon = "1.10"
parking_lot = "0.12"

arc-swap = "1.7"
crossbeam-channel = "0.5"
memmap2 = "0.9"
bytemuck = { version = "1", default-features = false }
smallvec = "1"
lru = "0.12"

# Span-aware parsing for `file:line:col` config errors without serde or `syn`;
# `display` enables format-preserving writes to the hand-edited config.
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }

# Merges per-page PDFs into one document. `chrono-clock` is off because it only
# stamps `/CreationDate`.
lopdf = { version = "0.45", default-features = false, features = ["rayon"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    # Message-mode named pipe between the settings window and the panel.
    # See `src/ipc/wire.rs`.
    "Win32_System_Pipes",
    # `ProcessIdToSessionId`, to make the machine-global pipe name per-session.
    "Win32_System_RemoteDesktop",
    # The `Run` value behind "Start with Windows". See `src/autostart.rs`.
    "Win32_System_Registry",
    "Win32_NetworkManagement_WNet",
    # WinHTTP for the update check. See `src/update/http.rs`.
    "Win32_Networking_WinHttp",
    "Win32_Security",
    # BCrypt SHA-256 for verifying a staged installer.
    "Win32_Security_Cryptography",
    # `ShellExecuteW`, to open a merged PDF in the user's registered viewer.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    # Backdrop, rounded corners and dark frame. Each call fails harmlessly on
    # older Windows, so `gui::window` needs no version check.
    "Win32_Graphics_Dwm",
    # `MARGINS`, which `DwmExtendFrameIntoClientArea` is gated on.
    "Win32_UI_Controls",
    # `RegisterHotKey`, and `ToUnicodeEx` for the AltGr path in `gui::input`.
    "Win32_UI_Input_KeyboardAndMouse",
    # Attaches to the launching console, or reports that there is none.
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    # `OutputDebugStringW`; the window binary has no console. See `src/log.rs`.
    "Win32_System_Diagnostics_Debug",
    # `MonitorFromWindow`, to place the panel on the monitor it was summoned on.
    "Win32_Graphics_Gdi",
    # `GetDpiForWindow`, to size the panel in the monitor's pixels.
    "Win32_UI_HiDpi",
]

# Tray icon and menu. Windows-only, which keeps GTK and X11 out of the graph.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
muda = { version = "0.20", default-features = false }

[build-dependencies]
# Embeds the icon, version block and manifest. See `build.rs`.
winresource = "0.1"

# Unsafe code is refused everywhere except the Win32 FFI modules listed in
# tools/unsafe-allowlist.txt, and each block there needs a `// SAFETY:` comment.
# See docs/CODE_STANDARDS.md#unsafe-code.
[lints.rust]
unsafe_code = "deny"
# snake_case functions, UpperCamelCase types, UPPER_SNAKE_CASE constants.
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[features]
# Embeds `eframe/default_fonts` (1.41 MB of TTFs, omitted from release builds)
# so layouts are identical on every machine. See `gui::fonts::install_bundled`.
test-fonts = ["eframe/default_fonts"]
# Enables image snapshot tests, which need a GPU adapter and `test-fonts`.
# The accessibility-tree tests in `tests/panel.rs` run without it.
ui-snapshots = ["test-fonts"]

[dev-dependencies]
# Drives the panel UI with synthetic input and checks the accessibility tree
# and pixels. Must match the `eframe` version, since it shares `egui::Context`.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "matcher"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keeps symbol names so `RUST_BACKTRACE` reports from the field stay readable.
strip = "debuginfo"
# `panic` stays "unwind": handle cleanup relies on `Drop`, and `src/hotkey`
# defines no `extern "system"` callback so unwinding never crosses FFI.

[profile.release-dbg]
inherits = "release"
debug = 1
strip = "none"
