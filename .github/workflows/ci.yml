# Builds with warnings as errors and runs the tests. See CONTRIBUTING.md.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; pushes to master all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build
        run: dotnet build Files.slnx -c Release
      - name: test
        run: dotnet test Files.slnx -c Release --no-build --collect:"XPlat Code Coverage"
